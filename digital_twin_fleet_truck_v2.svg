      <rect x="0" y="115" width="362" height="6"/>
      <rect x="358" y="108" width="6" height="14" rx="1"/>
      <circle cx="60" cy="128" r="14"/>
      <circle cx="92" cy="128" r="14"/>
      <circle cx="170" cy="128" r="14"/>
      <circle cx="202" cy="128" r="14"/>
      <circle cx="275" cy="128" r="14"/>
      <circle cx="340" cy="128" r="14"/>
    </clipPath>
  </defs>

  <rect width="680" height="360" fill="transparent" style="fill:rgba(0, 0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

