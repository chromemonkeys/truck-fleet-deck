<svg width="100%" viewBox="0 0 690 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt-title dt-desc" style="">
  <title id="dt-title" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Digital twin heavy fleet truck animation</title>
  <desc id="dt-desc" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A black heavy fleet truck silhouette splits into a solid physical truck and a translucent blue digital twin with telemetry dots and data streams between them.</desc>

  <defs>
    <linearGradient id="ghostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#85B7EB" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#378ADD" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#85B7EB" stroke-width="0.4" stroke-opacity="0.35"/>
    </pattern>

    <symbol id="truck" viewBox="0 0 380 160" overflow="visible">
      <rect x="2" y="10" width="240" height="105" rx="2"/>
      <rect x="240" y="100" width="6" height="15"/>
      <path d="M 252 35 L 310 35 L 330 55 L 360 60 L 360 115 L 252 115 Z"/>
      <rect x="0" y="115" width="362" height="6"/>
      <rect x="358" y="108" width="6" height="14" rx="1"/>
      <circle cx="60" cy="128" r="14"/>
      <circle cx="92" cy="128" r="14"/>
      <circle cx="170" cy="128" r="14"/>
      <circle cx="202" cy="128" r="14"/>
      <circle cx="275" cy="128" r="14"/>
      <circle cx="340" cy="128" r="14"/>
    </symbol>

